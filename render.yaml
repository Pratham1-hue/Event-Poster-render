services:
  # Python API: POST /api/generate, GET /api/health
  - type: web
    name: poster-lab-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: CORS_ORIGINS
        value: "*"

  # React frontend (Vite static — static sites have no plan field)
  - type: web
    name: poster-lab-web
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_URL
        fromService:
          type: web
          name: poster-lab-api
          property: host
